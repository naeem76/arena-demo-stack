spring.application.name=arena-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/arena}
spring.datasource.username=${DATABASE_USERNAME:arena}
spring.datasource.password=${DATABASE_PASSWORD:arena_local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc.paths-to-match=/api/**
scalar.url=/v3/api-docs
scalar.path=/scalar

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
