spring.application.name=arena-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/arena}
spring.datasource.username=${DATABASE_USERNAME:arena}
spring.datasource.password=${DATABASE_PASSWORD:arena_local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.security.issuer=${AUTH_ISSUER_URI:http://localhost:8080}
app.security.client-id=scalar
app.security.demo-username=${DEMO_USERNAME:demo}
app.security.demo-password=${DEMO_PASSWORD:arena-demo}

springdoc.paths-to-match=/api/**
scalar.url=/v3/api-docs
scalar.path=/scalar
scalar.authentication.preferred-security-scheme=arenaOAuth
scalar.authentication.oauth2.arenaOAuth.flows.authorization-code.client-id=${app.security.client-id}
scalar.authentication.oauth2.arenaOAuth.flows.authorization-code.pkce=SHA_256
scalar.authentication.oauth2.arenaOAuth.flows.authorization-code.redirect-uri=${app.security.issuer}/scalar
scalar.authentication.oauth2.arenaOAuth.flows.authorization-code.selected-scopes=api.read,api.write

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
